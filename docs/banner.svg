<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f2e"/>
      <stop offset="1" stop-color="#123b3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- left: text -->
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#5fd3b0" letter-spacing="3">OPENCART 3.0.x EXTENSION</text>
  <text x="70" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">ChatGPT Ads</text>
  <text x="70" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Product Feed</text>
  <text x="70" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#b9c7d3">Your catalog in the OpenAI feed format</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e8eef3">
    <circle cx="82" cy="417" r="7" fill="#5fd3b0"/><text x="102" y="425">One Hosted URL, no cron</text>
    <circle cx="82" cy="462" r="7" fill="#5fd3b0"/><text x="102" y="470">Variants, WebP → JPEG, validator</text>
    <circle cx="82" cy="507" r="7" fill="#5fd3b0"/><text x="102" y="515">Large catalogs, Delta API</text>
  </g>

  <!-- right: feed file illustration -->
  <g transform="translate(800,110)">
    <rect x="0" y="0" width="320" height="380" rx="18" fill="#ffffff"/>
    <path d="M250 0 h52 a18 18 0 0 1 18 18 v52 z" fill="#d8e6ef"/>
    <rect x="28" y="34" width="120" height="34" rx="8" fill="#5fd3b0"/>
    <text x="88" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#0f1f2e">.csv</text>
    <g fill="#e3eaf0">
      <rect x="28" y="96" width="264" height="14" rx="7"/>
      <rect x="28" y="126" width="220" height="14" rx="7"/>
      <rect x="28" y="156" width="250" height="14" rx="7"/>
      <rect x="28" y="186" width="190" height="14" rx="7"/>
      <rect x="28" y="216" width="240" height="14" rx="7"/>
      <rect x="28" y="246" width="170" height="14" rx="7"/>
    </g>
    <g font-family="Consolas, monospace" font-size="17" fill="#3b5566">
      <text x="28" y="300">item_id, title, price…</text>
      <text x="28" y="328">availability: in_stock</text>
      <text x="28" y="356">is_ads_eligible: true</text>
    </g>
  </g>
</svg>
